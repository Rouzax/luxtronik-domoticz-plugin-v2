name: Release plugin zip

# Builds a clean, runtime-only zip (the 5 Python modules + README) and attaches it
# to the GitHub Release, so users can install without the docs/tests/site cruft.
on:
  release:
    types: [published]

permissions:
  contents: write   # upload the release asset only

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Build runtime-only zip
        run: |
          set -euo pipefail
          TAG="${{ github.event.release.tag_name }}"
          PKG="luxtronikex"
          mkdir -p "$PKG"
          cp plugin.py translations.py addresses.py context.py converters.py README.md "$PKG/"
          zip -r "${PKG}-${TAG}.zip" "$PKG"
          echo "Contents:"; unzip -l "${PKG}-${TAG}.zip"

      - name: Attach zip to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "luxtronikex-${{ github.event.release.tag_name }}.zip" --clobber
